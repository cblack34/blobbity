name: CI

on:
  push:
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test rules/Blobbity.Rules.sln --configuration Release
      - run: dotnet test app/Blobbity.App.sln --configuration Release
