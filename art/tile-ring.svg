<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 104" width="104" height="104">
  <!-- A ring that hugs a tile card from outside, white so the player tints it (stack blue, target orange).
       Nine-sliced in the player on a 40 px border, so its line stays 8 canvas units thick at any tile size. -->
  <rect x="4" y="4" width="96" height="96" rx="36" ry="36" fill="none" stroke="#fff" stroke-width="8"/>
</svg>
